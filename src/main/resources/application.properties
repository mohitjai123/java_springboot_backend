spring.application.name=demo
server.port=8080

# Database Configuration (MongoDB In-Memory)
mongo.url=mongodb://localhost:27017
mongo.db = my_api_db

weather.api.url = https://jsonplaceholder.typicode.com
# Maximum file size allowed for an individual file resource upload
spring.servlet.multipart.max-file-size=5MB

# Maximum total request size allowed for a single multipart/form-data submission bundle
spring.servlet.multipart.max-request-size=10MB
# Automatically create/update database collections based on your Model
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health,info,prometheus

# Optional: Include extra system-level metric details
management.metrics.web.server.request.autotime.enabled=true